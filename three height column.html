<!DOCTYPE html>
<html>
<head>
    <title>Three Equal Columns</title>

    <link rel="stylesheet" href="style5.css">
</head>

<body>

    <h1>Three Column Layout</h1>

    <div class="container">

        <div class="column">
            <h2>Column 1</h2>
            <p>HTML and CSS</p>
        </div>

        <div class="column">
            <h2>Column 2</h2>
            <p>JavaScript</p>
        </div>

        <div class="column">
            <h2>Column 3</h2>
            <p>Spring Boot</p>
        </div>

    </div>

</body>
</html>
