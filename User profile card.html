<!DOCTYPE html>
<html>
<head>
    <title>User Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .profile-card {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 25px;
            border-radius: 15px;
        }

        .profile-card img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
        }

        .bio {
            flex: 1;
        }

        .bio h2 {
            margin-top: 0;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .profile-card {
                flex-direction: column;
                text-align: center;
            }

            .profile-card img {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <img src="https://via.placeholder.com/180" alt="Profile Picture">

        <div class="bio">
            <h2>Nandhini</h2>

            <p>
                I am a fresher interested in software development.
                I am currently learning Java, SQL and Spring Boot.
            </p>

            <p>
                I am interested in developing web applications
                and improving my programming skills.
            </p>
        </div>

    </div>

</body>
</html>
