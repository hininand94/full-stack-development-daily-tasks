<html>
<head>
    <title>Fading Box</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            background-color: red;
            animation: fadeIn 3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <h2>Fading Box</h2>
    <div class="box"></div>

</body>
</html>
