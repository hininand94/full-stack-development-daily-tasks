<html>
<head>
    <title>Navigation Bar</title>
    <style>
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            display: inline-block;
            background-color: navy;
            padding: 10px 20px;
            margin-right: 5px;
        }

        li a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h2>Navigation Bar</h2>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

</body>
</html>
