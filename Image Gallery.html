<html>
    <head>
        <title>Responsive Grid Image</title>
    
        <style>
            * {
                box-sizing: border-box;
            }
    
            body {
                margin: 0;
                font-family: Arial, sans-serif;
            }
    
            .grid-container {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
                padding: 15px;
            }
    
    
            .gallery img {
                width: 100%;
                height: auto;
                border-radius: 8px;
                object-fit: cover;
            }
            @media (max-width: 600px) {
                .gallery {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <h2>Image Gallery</h2>
        <div class="gallery">
          <img src="https://picsum.photos/400/300?1" alt="Gallery Image 1">
        <img src="https://picsum.photos/400/300?2" alt="Gallery Image 2">
        <img src="https://picsum.photos/400/300?3" alt="Gallery Image 3">
            
              </div>
    </body>
</html>
