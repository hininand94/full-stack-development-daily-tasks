<!DOCTYPE html>
<html>
<head>
    <title>User Profile Card</title>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            border: 2px solid gray;
            text-align: center;
        }

        .card img {
            display: block;
            width: 100px;
            height: 100px;
            margin: auto;
            border-radius: 50%;
        }

        .name {
            display: block;
            font-size: 22px;
            margin: 10px;
        }

        .status {
            display: inline-block;
            background-color: lightgreen;
            border: 1px solid green;
            padding: 5px 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://via.placeholder.com/100" alt="Profile Image">

        <div class="name">Nand</div>

        <span class="status">Online</span>
    </div>

</body>
</html>
